:root{--k-121409:#121409;--k-141808:#141808;--k-151807:#151807;--k-181B0B:#181B0B;--k-1A1D12:#1A1D12;--k-1C1F14:#1C1F14;--k-1C200C:#1C200C;--k-1E230D:#1E230D;--k-22261A:#22261A;--k-22280D:#22280D;--k-252A11:#252A11;--k-282E14:#282E14;--k-2A220F:#2A220F;--k-2A3013:#2A3013;--k-2A3112:#2A3112;--k-2A3117:#2A3117;--k-2F3420:#2F3420;--k-30291A:#30291A;--k-3A4519:#3A4519;--k-46541E:#46541E;--k-4C5726:#4C5726;--k-4E5829:#4E5829;--k-56612E:#56612E;--k-5A652F:#5A652F;--k-5B6A2B:#5B6A2B;--k-6A6E5C:#6A6E5C;--k-6E7A38:#6E7A38;--k-8C9A55:#8C9A55;--k-93733A:#93733A;--k-A2A690:#A2A690;--k-A3864A:#A3864A;--k-A4B567:#A4B567;--k-A9B66C:#A9B66C;--k-C7D58F:#C7D58F;--k-CFB27A:#CFB27A;--k-D2B67D:#D2B67D;--k-D7E29C:#D7E29C;--k-DFE2D3:#DFE2D3;--k-E2CC97:#E2CC97;--k-E5E9D3:#E5E9D3;--k-E6ECC6:#E6ECC6;--k-E9EDC9:#E9EDC9;--k-EDEFE3:#EDEFE3;--k-F0DDAF:#F0DDAF;--k-F0F1E8:#F0F1E8;--k-F1EADA:#F1EADA;--k-F1F2EA:#F1F2EA;--k-F2F0E2:#F2F0E2;--k-F4F1E4:#F4F1E4;--k-F4F5EC:#F4F5EC;--k-F6E4B8:#F6E4B8;--k-F6F7F0:#F6F7F0}
/* Layout: web app mobile-first. Celular = columna con barra inferior flotante (ítem activo en círculo). Computadora (≥960px) = barra superior y grillas de 2-3 columnas. */
:root{
  --bg:var(--k-F1F2EA); --surface:#FFFFFF; --surface-2:var(--k-F6F7F0); --ink:var(--k-1C1F14); --muted:var(--k-6A6E5C); --line:var(--k-DFE2D3);
  --accent:var(--k-5B6A2B); --accent-2:var(--k-3A4519); --accent-ink:var(--on-accent,#FFFFFF); --accent-soft:var(--k-E5E9D3);
  --brass:var(--k-A3864A); --brass-soft:var(--k-F1EADA); --star:#C9A23F; --ok:#3F7A3A; --ok-soft:#E1EEDB; --warn:#9A6400; --warn-soft:#F6ECD6; --danger:#A2412F;
  --ph-1:var(--k-5A652F); --ph-2:var(--k-252A11); --shadow:0 12px 32px color-mix(in srgb, var(--k-282E14) 12%, transparent); --glow:0 10px 22px color-mix(in srgb, var(--k-46541E) 32%, transparent);
  --f:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--k-121409); --surface:var(--k-1A1D12); --surface-2:var(--k-22261A); --ink:var(--k-EDEFE3); --muted:var(--k-A2A690); --line:var(--k-2F3420);
  --accent:var(--k-A4B567); --accent-2:var(--k-C7D58F); --accent-ink:var(--k-151807); --accent-soft:var(--k-2A3117);
  --brass:var(--k-CFB27A); --brass-soft:var(--k-30291A); --star:#E0BD5C; --ok:#7CC174; --ok-soft:#1D2D1A; --warn:#E3A84C; --warn-soft:#352812; --danger:#E3826D;
  --ph-1:var(--k-4E5829); --ph-2:var(--k-181B0B); --shadow:0 12px 32px rgba(0,0,0,.5); --glow:0 10px 22px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--k-121409); --surface:var(--k-1A1D12); --surface-2:var(--k-22261A); --ink:var(--k-EDEFE3); --muted:var(--k-A2A690); --line:var(--k-2F3420);
  --accent:var(--k-A4B567); --accent-2:var(--k-C7D58F); --accent-ink:var(--k-151807); --accent-soft:var(--k-2A3117);
  --brass:var(--k-CFB27A); --brass-soft:var(--k-30291A); --star:#E0BD5C; --ok:#7CC174; --ok-soft:#1D2D1A; --warn:#E3A84C; --warn-soft:#352812; --danger:#E3826D;
  --ph-1:var(--k-4E5829); --ph-2:var(--k-181B0B); --shadow:0 12px 32px rgba(0,0,0,.5); --glow:0 10px 22px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:clip}
body{overflow-x:clip;overscroll-behavior-x:none}
/* iPhone hace zoom solo al tocar un campo con letra menor a 16px: lo evitamos */
@media (max-width:959px){input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea{font-size:max(16px,1em)!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
.screen{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}.xs{font-size:12px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl{font-weight:800;letter-spacing:-.025em;line-height:1.05}
.hl em{font-style:normal;color:var(--accent)}
.t1{font-size:32px}.t2{font-size:25px}.t3{font-size:20px}.t4{font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:14px;min-width:0}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:0 0 auto;position:relative}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.link{color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h2{font-weight:800;font-size:21px;letter-spacing:-.02em}
.price{font-weight:700;white-space:nowrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none;border:1.5px solid transparent;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent-2)}
.btn.brass{background:var(--brass);color:var(--k-1C1F14)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.cta{display:flex;align-items:center;gap:12px;width:100%;padding:6px 18px 6px 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-decoration:none;border:0;box-shadow:var(--glow)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.cta .ci{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.cta .lb{flex:1;text-align:center}
.cta .chev{display:flex;opacity:.7}
.cta .chev svg{margin-left:-10px}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.badge.olive{background:var(--accent-soft);border-color:transparent;color:var(--accent-2)}
.badge.brass{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24);color:#fff}
.stars{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.stars svg{color:var(--star)}
.stars span{color:var(--muted);font-weight:500}

/* Fotos provisorias */
.ph{position:relative;background:radial-gradient(90% 70% at 70% 20%,rgba(255,255,255,.14),transparent 60%),linear-gradient(160deg,var(--ph-1),var(--ph-2));display:grid;place-items:center;color:color-mix(in srgb, var(--k-F0F1E8) 42%, transparent);overflow:hidden}
.ph[data-label]::after{content:attr(data-label);position:absolute;left:12px;bottom:10px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb, var(--k-F0F1E8) 60%, transparent)}

/* Inicio */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--k-F0F1E8);background:linear-gradient(160deg,var(--ph-1),var(--ph-2));flex:0 0 auto;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.vmark{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(160deg,var(--k-3A4519),var(--k-1C200C));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--k-D2B67D) 25%, transparent)}
.vmark img{width:64%;height:auto;display:block;margin-top:2px}
.wordmark{display:block;height:auto;max-width:100%}
:root:not([data-theme="dark"]) .wordmark.onlight{filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wordmark.onlight{filter:none}}
.monogram{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:24px;flex:0 0 auto}
.search{display:flex;gap:10px}
.search label{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:52px;min-width:0}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search .iconbtn{width:52px;height:52px}
.banner{position:relative;border-radius:26px;overflow:hidden;min-height:190px;display:grid;color:var(--k-F4F5EC);background:linear-gradient(110deg,var(--k-2A3013),var(--k-56612E))}
.banner .art{position:absolute;inset:0 0 0 46%;-webkit-mask:linear-gradient(90deg,transparent,#000 35%);mask:linear-gradient(90deg,transparent,#000 35%)}
.banner .art .ph{height:100%}
.banner .copy{position:relative;padding:20px;display:grid;gap:8px;align-content:center;max-width:62%}
.banner .copy p{color:color-mix(in srgb, var(--k-F4F5EC) 78%, transparent);font-size:13.5px}
.banner .pill{justify-self:start;margin-top:6px;background:var(--k-E6ECC6);color:var(--k-2A3112);box-shadow:none}
.planrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory}
.plancard{flex:0 0 78%;scroll-snap-align:start;border-radius:24px;padding:18px;display:grid;gap:10px;background:var(--surface);border:1.5px solid var(--line);align-content:start}
.plancard.feat{border-color:var(--brass);background:linear-gradient(170deg,var(--brass-soft),var(--surface) 60%)}
.plancard .amt{font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.save{color:var(--ok);font-weight:700;font-size:13.5px}
.perks{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14px}
.perks li{display:flex;gap:8px;align-items:flex-start}
.perks li svg{flex:0 0 auto;color:var(--accent);margin-top:2px}
.perks li.no{color:var(--muted)}
.perks li.no svg{color:var(--danger)}
.clubcard{position:relative;border-radius:26px;overflow:hidden;padding:20px;display:grid;gap:12px;color:var(--k-F4F1E4);text-align:left;width:100%;
  background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb, var(--k-E2CC97) 35%, transparent),transparent 55%),linear-gradient(140deg,var(--k-3A4519),var(--k-1E230D));box-shadow:var(--shadow)}
.clubcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px);pointer-events:none}
.clubcard > *{position:relative}
.clubcard .crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,var(--k-F0DDAF),var(--k-A3864A));color:var(--k-1C1F14);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.clubcard .muted{color:color-mix(in srgb, var(--k-F4F1E4) 72%, transparent)}
.clubcard .feats{display:flex;flex-wrap:wrap;gap:6px}
.clubcard .go{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid color-mix(in srgb, var(--k-F4F1E4) 16%, transparent);padding-top:12px;font-weight:700}
.clubcard .go span.arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--k-E2CC97);color:var(--k-1C1F14)}
.circles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.circ{display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center}
.circ .ph{width:68px;height:68px;max-width:100%;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.topbarber{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:10px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.topbarber .ph{height:170px;border-radius:20px}
.works{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.work{flex:0 0 auto;width:156px;scroll-snap-align:start;display:grid;gap:8px}
.work .ph{height:190px;border-radius:20px}
.work b{font-size:14px}

/* Tarjeta de fidelidad */
.vcard{position:relative;border-radius:26px;padding:20px;color:var(--k-F2F0E2);overflow:hidden;display:grid;gap:16px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb, var(--k-D7E29C) 22%, transparent),transparent 55%),linear-gradient(145deg,var(--k-4C5726),var(--k-2A3013) 55%,var(--k-1C200C));box-shadow:var(--shadow)}
.vcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px);pointer-events:none}
.vcard > *{position:relative}
.vcard .k{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb, var(--k-F2F0E2) 60%, transparent)}
.vcard .mark{font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.vcard .mark small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb, var(--k-F2F0E2) 60%, transparent);margin-top:5px}
.seals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seal{aspect-ratio:1/1;max-width:100%;border-radius:50%;border:1.5px dashed color-mix(in srgb, var(--k-F2F0E2) 30%, transparent);display:grid;place-items:center;font-size:11px;font-weight:700;color:color-mix(in srgb, var(--k-F2F0E2) 40%, transparent)}
.seal.on{border:0;background:radial-gradient(circle at 32% 28%,var(--k-E9EDC9),var(--k-A9B66C) 55%,var(--k-6E7A38));color:var(--k-22280D);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.35);font-size:16px;font-weight:800}
.seal.reward{border:1.5px solid var(--k-D2B67D);color:var(--k-D2B67D)}
.seal.reward.on{background:radial-gradient(circle at 32% 28%,var(--k-F6E4B8),var(--k-D2B67D) 55%,var(--k-93733A));color:var(--k-2A220F)}
.vcard .bar{height:4px;border-radius:9px;background:color-mix(in srgb, var(--k-F2F0E2) 16%, transparent);overflow:hidden}
.vcard .bar i{display:block;height:100%;background:var(--k-D7E29C)}
.vcard .foot{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.vcard .holder{color:var(--k-F2F0E2);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Reservar: listado */
.cover{position:relative;margin-inline:-16px;margin-top:-18px;height:250px;border-radius:0 0 32px 32px;overflow:hidden}
.cover .ph{height:100%}
.cover .iconbtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;background:rgba(255,255,255,.9);border:0;color:var(--k-1C1F14)}
.statcard{margin-top:-62px;position:relative;z-index:2;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px}
.statcard > div{display:grid;gap:4px;padding:0 12px;border-left:1px solid var(--line)}
.statcard > div:first-child{border-left:0}
.statcard .k{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.statcard b{font-size:17px;font-weight:800}
.offer{justify-self:start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.svcitem{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;border-radius:24px;background:var(--surface);border:1px solid var(--line);align-items:stretch}
.svcitem .ph{border-radius:18px;min-height:104px}
.svcitem .body{display:grid;gap:4px;align-content:space-between;min-width:0}
.svcitem .nm{font-weight:800;font-size:17px;letter-spacing:-.01em}
.svcitem .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.svcitem .bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.filters-on{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Reservar: agenda */
.sel{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.sel .ph{height:72px;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;gap:10px}
.cal .head{display:flex;align-items:center;justify-content:space-between}
.cal .head b{font-size:17px;font-weight:800;text-transform:capitalize}
.cal .nav2{display:flex;gap:6px}
.cal .nav2 button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.cal .nav2 button:disabled{opacity:.35;cursor:not-allowed}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1/1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14.5px;position:relative;background:var(--surface-2)}
.cal .d:disabled{background:transparent;color:var(--muted);opacity:.45;cursor:not-allowed;font-weight:500}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal .d[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}

.field{display:grid;gap:6px}

.inp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 18px 6px 6px}

.inp .ic{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.inp input{border:0;background:none;outline:none;flex:1;min-width:0;padding:8px 0}
.field select,.field > input{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;width:100%;min-width:0}
.lines{display:grid}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}

/* Confirmado */

/* Barra fija (celular) */
.ctabar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.ctabar .in{max-width:448px;margin:0 auto;display:grid;gap:8px}

/* Barra inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:14;width:min(448px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}

/* Turnos */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}

.nextup{border-radius:26px;padding:20px;color:var(--k-F2F0E2);display:grid;gap:14px;background:linear-gradient(140deg,var(--k-56612E),var(--k-2A3013));box-shadow:var(--shadow)}
.nextup .muted{color:color-mix(in srgb, var(--k-F2F0E2) 72%, transparent)}
.nextup .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid color-mix(in srgb, var(--k-F2F0E2) 18%, transparent);padding-top:14px}

.nextup .btn.ghost{color:var(--k-F2F0E2);border-color:color-mix(in srgb, var(--k-F2F0E2) 30%, transparent);background:transparent}
.nextup .btn.light{background:var(--k-E6ECC6);color:var(--k-2A3112)}
.bk{display:grid;gap:12px;min-width:0;max-width:100%;padding:16px;border-radius:22px;border:1px solid var(--line);background:var(--surface)}
.bk .top{display:flex;justify-content:space-between;gap:10px;align-items:center}

.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Cuenta */
.acct{display:grid;justify-items:center;text-align:center;gap:10px}
.avatar{overflow:hidden}

.acct .big{overflow:hidden;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;background:linear-gradient(150deg,var(--k-8C9A55),var(--k-3A4519));box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--line),var(--glow)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:12px;text-align:center;min-width:0}

.menu{display:grid}
.menu .it{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-decoration:none}

.switch{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}

.switch.on{background:var(--accent)}

.socio{border-radius:24px;padding:18px;display:grid;gap:10px;background:linear-gradient(140deg,var(--k-E2CC97),var(--k-A3864A));color:var(--k-1C1F14)}

/* Acceso */
.auth{display:grid;gap:22px;padding-top:12px}

.remember{display:flex;align-items:center;justify-content:space-between;font-size:13.5px}

.otp{display:flex;justify-content:center;gap:12px}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:24px;background:var(--surface-2)}

/* Hoja de filtros */
.sheet-bg{position:fixed;inset:0;z-index:40;background:color-mix(in srgb, var(--k-121409) 45%, transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px 12px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}

.opt .tx{flex:1}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;flex:0 0 auto}
[aria-pressed="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}

/* Panel */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto}
.seg button{flex:1;padding:9px 12px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}
.day{flex:0 0 auto;width:56px;border-radius:999px;padding:10px 0 8px;display:grid;justify-items:center;gap:4px;background:var(--surface);border:1px solid var(--line)}
.day span{font-size:11px;color:var(--muted);font-weight:600}

.tbl{display:grid;gap:8px}

.progress{display:flex;gap:6px}

.minirow{display:flex;gap:12px;align-items:center;width:100%}

.mv{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.grid2 input,.sheet input,.sheet select{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;width:100%;min-width:0}
.mpbtn{background:#009EE3;color:#fff}

.week{display:grid;min-width:720px}

.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

@media (prefers-reduced-motion:no-preference){.slot,.chip,.cal .d,.nav button,.opt{transition:background .15s,border-color .15s,box-shadow .15s}.screen{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

const avatarOf = (c, size=50, tag="span", attrs="") => `<${tag} class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px" ${attrs}>${c&&c.avatar?`<img src="${esc(c.avatar)}" alt="">`:initials(c?.name||"?")}</${tag}>`;
/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString("es-AR");
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const digits = s => String(s||"").replace(/\D/g,"");
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD = s => new Date(s+"T00:00:00");
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => ymd(new Date());

function hex2hsl(hex){
  const h = String(hex).replace("#",""); const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let H=0, S=0; const L=(mx+mn)/2;
  if (mx!==mn){ const d=mx-mn; S = L>.5 ? d/(2-mx-mn) : d/(mx+mn); H = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; H*=60; }
  return [H,S,L];
}
function hsl2hex(H,S,L){
  H=((H%360)+360)%360; S=Math.min(1,Math.max(0,S)); L=Math.min(1,Math.max(0,L));
  const f = n => { const k=(n+H/30)%12, a=S*Math.min(L,1-L); const c=L-a*Math.max(-1,Math.min(k-3,9-k,1)); return Math.round(c*255).toString(16).padStart(2,"0"); };
  return "#"+f(0)+f(8)+f(4);
}
function mapCol(hex, base, tgt){
  const [h,s,l] = hex2hsl(hex), [bh,bs,bl] = base; let [th,ts,tl] = tgt;
  tl = Math.min(.55, Math.max(.08, tl));
  let s2 = bs ? s*ts/bs : 0; if (s < .3) s2 = Math.min(s2, .3);
  const w = Math.max(0, 1 - Math.abs(l-bl)/.25);
  return hsl2hex(th + (h-bh), s2, l + (tl-bl)*w);
}

  if (c1.toUpperCase()===BRAND0.color.toUpperCase() && c2.toUpperCase()===BRAND0.color2.toUpperCase()) return { css:"", accent:BRAND0.color };

}

async function uploadImg(file, name, { size=900, square=true, png=false }={}){
  let blob, ext, type;
  if (file.type==="image/svg+xml"){ blob = file; ext = "svg"; type = file.type; }
  else {
    const bmp = await createImageBitmap(file);
    let W, H;
    if (square){ W = H = size; } else { const sc = Math.min(1, size/Math.max(bmp.width,bmp.height)); W = Math.round(bmp.width*sc); H = Math.round(bmp.height*sc); }
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const cx = cv.getContext("2d");
    if (square){ const sc = Math.max(W/bmp.width, H/bmp.height); cx.drawImage(bmp,(W-bmp.width*sc)/2,(H-bmp.height*sc)/2,bmp.width*sc,bmp.height*sc); }
    else cx.drawImage(bmp,0,0,W,H);
    type = png ? "image/png" : "image/jpeg"; ext = png ? "png" : "jpg";
    blob = await new Promise(r => cv.toBlob(r, type, 0.86));
  }
  const path = `${me}/${name}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:type, upsert:true });
  if (error) throw error;
  return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
}

function slotsFor(date, barberId, block, socio){
  const h = hoursOf(date); if (!h) return [];
  const out = []; const isToday = date === today();
  for (let t=h[0]*60; t+block<=h[1]*60; t+=30){
    if (isToday && t <= nowMin()+20) continue;
    const ids = (barberId==="any" ? bars() : [barber(barberId)]).filter(b=>b && worksOn(b,date)).map(b=>b.id);
    const freeId = ids.find(id => isFree(id, date, t, block, bk.resId));

  }

}

function hoursText(){
  const ord=[1,2,3,4,5,6,0], ab=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"], H=db.cfg.hours, out=[]; let i=0;
  while (i<7){ const h=H[ord[i]]; if (!h){ i++; continue; } let j=i;
    while (j+1<7 && H[ord[j+1]] && H[ord[j+1]][0]===h[0] && H[ord[j+1]][1]===h[1]) j++;
    out.push((i===j?ab[ord[i]]:`${ab[ord[i]]} a ${ab[ord[j]]}`)+` ${h[0]}–${h[1]}`); i=j+1; }
  return out.join(" · ");
}

function filteredServices(){
  let list = svcs().filter(s => !q || (s.name+" "+s.desc).toLowerCase().includes(q.toLowerCase()));

  if (filt.sort==="price") list = [...list].sort((a,b)=>a.price-b.price);
  if (filt.sort==="dur") list = [...list].sort((a,b)=>a.dur-b.dur);
  return list;
}

async function confirmBooking(){
  if (!sb || !me){ toast("Ingresá para reservar"); return; }
  const c = client(me); const block = blockOf(bk.serviceId, bk.extras);
  const barberId = bk.barberId==="any" ? (bars().filter(b=>worksOn(b,bk.date)).map(b=>b.id).find(id=>isFree(id,bk.date,bk.start,block,bk.resId)) || "any") : bk.barberId;
  document.querySelectorAll("[data-next]").forEach(x=>{ x.disabled=true; const lb=x.querySelector(".lb"); if (lb) lb.textContent="Reservando…"; });
  const { data, error } = await sb.rpc("book", { p_shop:SHOP, p_service:bk.serviceId, p_extras:bk.extras, p_barber:barberId, p_date:bk.date, p_start:bk.start,
    p_use_plan:!!bk.usePlan, p_name:(c?.name||bk.name||"").trim(), p_phone:digits(bk.phone)||c?.phone||"", p_res:bk.resId||null, p_mp: !!(db.cfg.mpOn && !bk.transfer && bstep==="pay") });
  if (error){
    const m = error.message||"";
    toast(m.includes("ocupar") ? "Ese horario se acaba de ocupar. Elegí otro." : m || "No se pudo reservar");
    await loadBusy(); if (m.includes("ocupar")){ bk.start=null; bstep="agenda"; } render(); return;
  }
  const nb = mapB(data);
  if (nb.depStatus==="pendiente_mp"){ await goMP({ booking_id: nb.id }); return; }
  pushNotify(nb.id, "new");
  done = nb; bk = fresh(); calMonth = null; await loadAll(); render(); window.scrollTo({top:0});
}
async function goMP(body){
  toast("Abriendo Mercado Pago…");
  const { data, error } = await sb.functions.invoke("mp-checkout",{ body:{ ...body, shop:SHOP, site: location.origin + (SHOP && location.pathname.startsWith("/"+SHOP) ? "/"+SHOP : "") } });
  if (error || !data || !data.init_point){ toast((data && data.error) || "No se pudo abrir Mercado Pago"); await loadAll(); render(); return; }
  location.href = data.init_point;
}

const multiBar = () => bars().length>1;
const barOk = b => !admin.bar || admin.bar==="all" || b.barberId===admin.bar;
const BAR_COLORS = ["var(--accent)","var(--brass)","#4F7CAC","#B0644A","#7A5BA6","#3F8A7A"];
const barColor = id => BAR_COLORS[Math.max(0, db.barbers.findIndex(x=>x.id===id)) % BAR_COLORS.length];
const barFilter = () => multiBar() ? `<div class="barfilter"><button class="chip sm" data-abar="all" aria-pressed="${admin.bar==="all"}">Todos</button>${bars().map(b=>`<button class="chip sm" data-abar="${b.id}" aria-pressed="${admin.bar===b.id}"><span class="bdot" style="background:${barColor(b.id)}"></span>${esc(String(b.name||proName()).split(" ")[0])}</button>`).join("")}</div>` : "";
function aAgenda(){

function weekStart(dstr){ const d=parseD(dstr); const off=(d.getDay()+6)%7; return addDays(d,-off); }
function aWeek(){
  const ws=weekStart(admin.date); const days=[...Array(7)].map((_,i)=>ymd(addDays(ws,i)));
  const open=Object.values(db.cfg.hours); const h0=Math.min(...open.map(h=>h[0]),10), h1=Math.max(...open.map(h=>h[1]),20);
  const PX=52/60; const H=(h1-h0)*60*PX;
  const total=db.bookings.filter(b=>days.includes(b.date)&&b.status!=="cancelado"&&barOk(b)).length;
  const lanes = multiBar() && admin.bar==="all" ? bars().map(b=>b.id) : null;
  const d0=parseD(days[0]), d6=parseD(days[6]); const label = d0.getMonth()===d6.getMonth() ? `${d0.getDate()} al ${d6.getDate()} de ${MESES[d6.getMonth()]}` : `${d0.getDate()} de ${MESES[d0.getMonth()]} al ${d6.getDate()} de ${MESES[d6.getMonth()]}`;
  return `<div class="row"><button class="iconbtn" data-wk="-7" aria-label="Semana anterior">${ico("back",18)}</button><div style="text-align:center"><b>${label}</b><p class="xs muted">${total} turnos</p></div><button class="iconbtn" data-wk="7" aria-label="Semana siguiente">${ico("right",18)}</button></div>
  <div class="weekwrap"><div class="week" style="grid-template-columns:44px repeat(7,minmax(92px,1fr))">
    <div class="wh"></div>${days.map(d=>{const dd=parseD(d);return `<button class="wh ${d===today()?"on":""}" data-aday="${d}" data-toview="lista">${DIAS[dd.getDay()].slice(0,3)}<b>${dd.getDate()}</b></button>`;}).join("")}
    <div class="hrs" style="height:${H}px">${[...Array(h1-h0+1)].map((_,i)=>`<span style="top:${i*60*PX}px">${String(h0+i).padStart(2,"0")}</span>`).join("")}</div>
    ${days.map(d=>{ const hs=hoursOf(d); const evs=db.bookings.filter(b=>b.date===d&&b.status!=="cancelado"&&barOk(b));
      return `<div class="col" style="height:${H}px;${hs?"":"background-color:var(--surface-2)"}">${evs.map(b=>`<button class="ev ${b.status}" data-openbk="${b.id}" style="top:${(b.start-h0*60)*PX}px;height:${Math.max(26,(b.block-Number(db.cfg.tolerance))*PX-2)}px;${lanes?`left:calc(${Math.max(0,lanes.indexOf(b.barberId))*100/lanes.length}% + 2px);right:auto;width:calc(${100/lanes.length}% - 4px);border-left-color:${barColor(b.barberId)}`:""}"><b>${hhmm(b.start)} ${esc(String(b.name).split(" ")[0])}</b>${esc(svc(b.serviceId)?.name||"")}</button>`).join("")}</div>`; }).join("")}
  </div></div><p class="xs muted">Tocá un turno para abrirlo, o un día para verlo en lista.</p>`;
}
function aMonth(){
  const base = admin.month ? parseD(admin.month) : parseD(admin.date); const y=base.getFullYear(), m=base.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7, nd=new Date(y,m+1,0).getDate();
  const inMonth=db.bookings.filter(b=>b.status!=="cancelado"&&barOk(b)&&parseD(b.date).getMonth()===m&&parseD(b.date).getFullYear()===y);
  const cells=[...Array(off)].map(()=>`<span></span>`).concat([...Array(nd)].map((_,i)=>{ const d=ymd(new Date(y,m,i+1)); const evs=inMonth.filter(b=>b.date===d);
    return `<button class="md ${d===today()?"today":""} ${hoursOf(d)?"":"off"}" data-aday="${d}" data-toview="lista"><b>${i+1}</b>${evs.length?`<span class="n">${evs.length}</span>`:"<span></span>"}</button>`; }));

}

/* ===== Ajustes: interacciones ===== */
function settingsClick(d){
  if ("set" in d){ admin.set = d.set || null; pending = null; render(); window.scrollTo({top:0}); return true; }
  if (d.step){ const [path, delta, mn, mx] = d.step.split("|"); const [o, f] = refOf(path); if (!o) return true;
    const lo = mn!==undefined ? Number(mn) : 0, hi = mx!==undefined ? Number(mx) : 1e9;
    o[f] = Math.min(hi, Math.max(lo, (Number(o[f])||0) + Number(delta))); render(); saveSoon(); return true; }
  if (d.setv){ const i = d.setv.indexOf("|"); const path = d.setv.slice(0,i), raw = d.setv.slice(i+1); const [o, f] = refOf(path); if (!o) return true;
    o[f] = NUMF.includes(f) ? Number(raw) : raw; if (path.startsWith("brand.")) applyBrand(); render(); saveSoon(); return true; }
  if (d.tog){ const [o, f] = refOf(d.tog); if (!o) return true; o[f] = !o[f]; render(); saveSoon(); return true; }
  if (d.color){ const [k, c] = d.color.split("|"); setBrand(k, c); applyBrand(); render(); saveSoon(); return true; }
  if (d.imgreset){ setImg(d.imgreset, ""); applyBrand(); render(); saveSoon(); return true; }
  if (d.dayon!==undefined && d.dayon!==""){ const w = Number(d.dayon); if (db.cfg.hours[w]) delete db.cfg.hours[w]; else db.cfg.hours[w] = [10,20]; render(); saveSoon(); return true; }
  if (d.bday){ const [id, w] = d.bday.split("|"); const b = db.barbers.find(x=>x.id===id); if (!b) return true;
    const all = [0,1,2,3,4,5,6].filter(x=>db.cfg.hours[x]); let days = Array.isArray(b.days) ? [...b.days] : all; const n = Number(w);
    days = days.includes(n) ? days.filter(x=>x!==n) : [...days, n];
    if (!days.length){ toast("Tiene que atender al menos un día"); return true; }
    b.days = days.sort(); render(); saveSoon(); return true; }
  if ("svcadd" in d){ const id = "s"+Date.now().toString(36); db.services.push({ id, name:"Nuevo servicio", desc:"", price:0, dur:45, icon:"scissors", rating:5 }); render(); saveSoon(); focusEdit(`services.${id}.name`); return true; }
  if (d.svcdel){ pending = "svcdel"+d.svcdel; render(); return true; }
  if (d.svcdelOk){ if (svcs().length<=1){ toast("Tiene que quedar al menos un servicio"); pending=null; render(); return true; } const it = db.services.find(x=>x.id===d.svcdelOk); if (it) it.off = true; pending = null; render(); saveSoon(); return true; }
  if ("xadd" in d){ const id = "x"+Date.now().toString(36); db.extras.push({ id, name:"Nuevo extra", price:0, dur:10 }); render(); saveSoon(); focusEdit(`extras.${id}.name`); return true; }
  if (d.xdel){ pending = "xdel"+d.xdel; render(); return true; }
  if (d.xdelOk){ const it = db.extras.find(x=>x.id===d.xdelOk); if (it) it.off = true; pending = null; render(); saveSoon(); return true; }
  if ("badd" in d){ const id = "b"+Date.now().toString(36); db.barbers.push({ id, name:"", role:proName(), bio:"" }); render(); saveSoon(); focusEdit(`barbers.${id}.name`); return true; }
  if (d.bdel){ pending = "bdel"+d.bdel; render(); return true; }
  if (d.bdelOk){ if (bars().length<=1){ pending=null; render(); return true; } const it = db.barbers.find(x=>x.id===d.bdelOk); if (it) it.off = true; pending = null; render(); saveSoon(); return true; }
  if ("padd" in d){ const id = "p"+Date.now().toString(36); const s0 = svcs()[0]; db.plans.push({ id, name:"Nuevo plan", cuts:2, serviceId:s0?.id, price:(s0?.price||0)*2, prio:false, excl:false, prod:5, aliados:false }); render(); saveSoon(); focusEdit(`plans.${id}.name`); return true; }
  if (d.pdel){ pending = "pdel"+d.pdel; render(); return true; }
  if (d.pdelOk){ db.plans = db.plans.filter(x=>x.id!==d.pdelOk); pending = null; render(); saveSoon(); return true; }
  return false;
}
function focusEdit(path){ setTimeout(()=>{ const i = document.querySelector(`[data-edit="${path}"]`); if (i){ i.scrollIntoView({block:"center", behavior:"smooth"}); i.focus(); i.select(); } }, 80); }
function settingsChange(el){
  const d = el.dataset;
  if (d.edit==="brand.name"){ const old = String(BR().name||"").trim(), nw = String(el.value).trim();
    if (old && nw && old!==nw) ["club","card"].forEach(k=>{ const v = String(BR()[k]||""); if (v.includes(old)) setBrand(k, v.split(old).join(nw)); }); }
  if (d.edit){ const [o, f] = refOf(d.edit); if (!o) return true;

/* ===== Avisos al celular (Web Push) ===== */
let pushState = { key:null, on:false, checked:false, help:false };
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && location.protocol==="https:";
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; } catch(e){ return false; } };
const b64u = s => { const b = atob((s + "===".slice((s.length+3)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b, c=>c.charCodeAt(0)); };
async function swReg(){ if (!("serviceWorker" in navigator) || location.protocol!=="https:") return null; try { return await navigator.serviceWorker.register("/sw.js"); } catch(e){ console.error(e); return null; } }
async function pushCheck(){
  if (pushState.checked || !sb || !SHOP) return; pushState.checked = true;
  try { const { data } = await sb.functions.invoke("push",{ body:{ check:true } }); pushState.key = (data && data.publicKey) || null; } catch(e){}
  try { if (pushSupported()){ const reg = await navigator.serviceWorker.getRegistration("/"); const sub = reg && await reg.pushManager.getSubscription(); pushState.on = !!sub && Notification.permission==="granted"; } } catch(e){}
  render();
}
async function pushEnable(){
  if (!me){ toast("Ingresá a tu cuenta primero"); return; }
  if (isIOS && !isStandalone()){ pushState.help = true; render(); return; }
  if (!pushSupported()){ toast("Este navegador no permite avisos. Probá con Chrome o Safari actualizados."); return; }
  if (!pushState.key){ toast("Los avisos todavía no están activados en el servidor"); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm!=="granted"){ toast("Para recibir avisos tenés que tocar “Permitir”"); return; }
    const reg = await swReg(); if (!reg){ toast("No se pudo activar en este navegador"); return; }
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(pushState.key) });
    const j = sub.toJSON();
    const { error } = await sb.rpc("save_push_sub",{ p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_shop:SHOP, p_admin:isAdminUser });
    if (error) throw error;
    pushState.on = true; pushState.help = false; render(); toast("¡Listo! Te vamos a avisar");
    sb.functions.invoke("push",{ body:{ test:true, shop:SHOP } }).catch(()=>{});
  } catch(e){ console.error(e); toast("No se pudo activar los avisos"); }
}
async function pushDisable(){
  try { const reg = await navigator.serviceWorker.getRegistration("/"); const sub = reg && await reg.pushManager.getSubscription();
    if (sub){ await sb.rpc("drop_push_sub",{ p_endpoint:sub.endpoint }); await sub.unsubscribe(); } } catch(e){}
  pushState.on = false; render(); toast("Avisos desactivados en este celular");
}
function pushNotify(booking_id, event, by){ if (sb && booking_id) sb.functions.invoke("push",{ body:{ booking_id, event, by } }).catch(()=>{}); }
function pushCard(ctx){
  if (!sb || !SHOP) return "";
  pushCheck();
  const adminCtx = ctx==="admin";
  const title = adminCtx ? "Avisos al celular" : "Avisos de tus turnos";
  const sub = adminCtx ? "Te llega una notificación cuando entra un turno nuevo o alguien cancela." : "Te avisamos cuando se confirma tu turno, el día anterior y un rato antes.";
  if (pushState.on) return `<div class="card pushcard on"><div class="row"><div class="row" style="justify-content:flex-start;gap:12px"><span class="pic">${ico("bell",20)}</span><div><b>${title}</b><p class="xs muted">Activados en este celular</p></div></div><span class="badge ok">${ico("check",12,2.6)} Activo</span></div>
    <div class="actions"><button class="btn ghost sm" data-pushtest>Probar</button><button class="link mutedlink" data-pushoff>Desactivar</button></div></div>`;
  const iosHelp = isIOS && !isStandalone();
  return `<div class="card pushcard"><div class="row" style="justify-content:flex-start;gap:12px"><span class="pic">${ico("bell",20)}</span><div><b>${title}</b><p class="xs muted">${sub}</p></div></div>
    ${iosHelp && pushState.help ? `<div class="note olive"><b>En iPhone, un paso antes:</b><ol class="steps"><li>Tocá <b>Compartir</b> ${ico("share",14,2)} abajo en Safari.</li><li>Elegí <b>Agregar a inicio</b>.</li><li>Abrí la app desde ese ícono y tocá <b>Activar avisos</b>.</li></ol></div>` : ""}
    <button class="btn block" data-pushon>${ico("bell",16)} Activar avisos</button></div>`;
}

async function createShop(){
  const f = plat.form; const name = f.name.trim(); const id = slugify(f.slug || name); const owner = f.owner.trim().toLowerCase();
  if (name.length<2){ toast("Escribí el nombre del local"); return; }
  if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(id) || RESERVED_SLUGS.includes(id)){ toast("Elegí otro link (solo letras, números y guiones)"); return; }
  if (owner && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(owner)){ toast("Revisá el correo del dueño"); return; }
  plat.busy = true; render();
  const full = [f.kind, name].join(" ");
  const { error } = await sb.rpc("create_shop",{ p_id:id, p_name:full, p_owner:owner, p_phone:digits(f.phone), p_data:shopTemplate(name, f.kind, f.phone) });
  plat.busy = false;
  if (error){ toast(error.message.includes("usado") ? "Ese link ya está usado. Probá con otro." : "No se pudo crear el local"); render(); return; }
  plat.created = { id, name:full, owner, phone:digits(f.phone) };
  plat.form = { name:"", kind:f.kind, slug:"", owner:"", phone:"" }; plat.slugTouched = false;
  await loadPlatform(); render(); window.scrollTo({top:0, behavior:"smooth"}); toast("¡Local creado!");
}
function platformClick(d){
  if (SHOP) return false;
  if (d.nfkind){ plat.form.kind = d.nfkind; render(); return true; }
  if ("nfcreate" in d){ createShop(); return true; }
  if ("pdone" in d){ plat.created = null; render(); return true; }
  if (d.shopst){ const [id, st] = d.shopst.split("|"); sb.rpc("set_shop_status",{ p_id:id, p_status:st }).then(async ({error})=>{ toast(error?"No se pudo":"Listo"); await loadPlatform(); render(); }); return true; }
  if ("pfsave" in d){ const wa = digits($("#pf-wa")?.value); sb.from("platform").update({ data:{ ...plat.data, wa } }).eq("id",1).then(({error})=>{ if (!error) plat.data.wa = wa; toast(error?"No se pudo guardar":"Guardado"); }); return true; }
  return false;
}
document.addEventListener("input", e => {
  if (SHOP) return; const id = e.target.id; const v = e.target.value;
  if (id==="nf-name"){ plat.form.name = v; if (!plat.slugTouched){ plat.form.slug = slugify(v); const s = $("#nf-slug"); if (s) s.value = plat.form.slug; } }
  if (id==="nf-slug"){ plat.slugTouched = true; plat.form.slug = slugify(v); }
  if (id==="nf-owner") plat.form.owner = v;
  if (id==="nf-phone") plat.form.phone = v;
});

render();

if (sb){
  sb.auth.onAuthStateChange((event, session) => {
    if (event==="PASSWORD_RECOVERY"){ recovery=true; screen="perfil"; }
    // Supabase repite SIGNED_IN al volver a la pestaña o al renovar la sesión: solo reaccionamos si cambió la cuenta
    const uid = session && session.user ? session.user.id : null;
    if (event==="SIGNED_IN" && loaded && uid && uid !== me) afterLogin();
    if (event==="SIGNED_OUT" && me){ loadAll().then(()=>{ screen="home"; render(); window.scrollTo({top:0}); }); }
  });
}
loadAll().then(async ()=>{
  const qs = new URLSearchParams(location.search), mp = qs.get("mp");
  if (mp){
    history.replaceState(null, "", location.pathname);
    if (mp==="ok"){ const b = db.bookings.find(x=>x.id===qs.get("b")); if (b){ done = b; screen="book"; } toast("¡Pago recibido! Tu turno está confirmado");
      setTimeout(async ()=>{ await loadAll(); if (done){ done = db.bookings.find(x=>x.id===done.id)||done; } render(); }, 4000); }
    else if (mp==="club"){ screen="club"; toast("¡Bienvenido al "+BR().club+"! Se activa en unos segundos"); setTimeout(refresh, 4000); }
    else { screen="turnos"; toast("El pago no se completó. Podés intentarlo de nuevo."); }
  } else if (restorePending()) await loadBusy();
  render();
});

</script>

</html>
